[[mismatch]]
unit = "query.face_p1"
case = "gen0224"
why = "C++ `SmCurve::CalculateTightBoundingBox` (source/SMLib/src/SmCurve.cpp:10277) adds the tangent-discontinuous and last B-spline knots regardless of the queried interval, so the tight box is enlarged to points the edge never reaches over `interval`. The Rust port keeps only knots strictly inside the interval (issue #1054). WR-474."
cpp_defect = "WR-474"

